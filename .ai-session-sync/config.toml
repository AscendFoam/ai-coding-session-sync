schema_version = "0.1.0"
project_id = "ai-coding-session-sync"
storage = "ignored-local"

[backend.local]
path = ".ai-session-sync"

[tools.codex]
enabled = true
mode = "handoff"
codex_home = "auto"
include_native = false

[tools.claude]
enabled = true
mode = "handoff"
claude_home = "auto"
include_native = false
include_memory = true

[redaction]
enabled = true
ruleset = "default"

[encryption]
enabled = false
provider = "age"
