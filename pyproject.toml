[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-session-sync"
version = "0.1.0"
description = "Project-bound AI coding session handoff and sync for Codex, Claude Code, and future AI coding CLIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AI Coding Session Sync contributors" }
]
keywords = ["codex", "claude-code", "session-sync", "handoff", "ai-coding"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development"
]
dependencies = []

[project.scripts]
aiss = "aiss.cli:main"
ai-session-sync = "aiss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
